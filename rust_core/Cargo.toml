[package]
name = "tts_core"
version = "0.1.0"
edition = "2021"
authors = ["KOReader TTS Plugin Authors"]
description = "Native Rust core engine for KOReader TTS plugin (Network, Codecs, Native Audio Sink)"
license = "MIT"

[lib]
name = "tts_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Async Runtime & Network
tokio = { version = "1.38", default-features = false, features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
bytes = "1.6"

# Audio Decoding (In-memory stream decoding for WAV, FLAC, MP3, OPUS/Ogg)
symphonia = { version = "0.5", default-features = false, features = ["wav", "flac", "mp3", "ogg", "vorbis"] }

# Serialization & Error Handling
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

# Lock-Free SPSC Ring Buffer for Event Polling
ringbuf = "0.4"

# Logging
log = "0.4"

[target.'cfg(not(target_os = "android"))'.dependencies]
env_logger = "0.11"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"

[dev-dependencies]
wiremock = "0.6"

[profile.release]
opt-level = "z"        # Optimize for size
lto = "fat"            # Fat Link-Time Optimization
codegen-units = 1      # Maximum cross-crate optimization
strip = true           # Strip all debug symbols and symbols table
