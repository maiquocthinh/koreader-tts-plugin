name: Build & Package KOReader TTS Plugin

on:
  push:
    branches: [ main ]
    tags: [ '*' ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]
  workflow_dispatch:

jobs:
  test:
    name: Run Rust & Lua Test Suites
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install LuaJIT
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit

      - name: Run Rust Unit Tests
        run: |
          cd rust_core
          cargo test

      - name: Run Lua Unit & Acceptance Test Suites
        run: |
          make test-lua

  build-and-package:
    name: Build Android Binaries & Package Release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain with Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Cross-compile Android Native Core (arm64-v8a, armeabi-v7a)
        run: |
          bash scripts/build_android.sh

      - name: Package Plugin Distribution
        run: |
          bash scripts/package_plugin.sh

      - name: Create ZIP Package
        run: |
          cd dist
          zip -r ../koreader_tts.koplugin.zip koreader_tts.koplugin/
          cd ..

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: koreader_tts.koplugin
          path: koreader_tts.koplugin.zip
          retention-days: 30

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: koreader_tts.koplugin.zip
          draft: false
          prerelease: false
          generate_release_notes: true
